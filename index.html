<style>
:root{--bg:#0d0c0a;--panel:#17140f;--ink:#ede6d7;--dim:#918b7b;--faint:#5d584d;--amber:#d6a04b;--green:#83aa73;--line:rgba(237,230,215,.09);--serif:"Fraunces",Georgia,serif;--sans:"Inter",sans-serif;--mono:"IBM Plex Mono",monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}button,textarea{font:inherit}button{color:inherit}header{min-height:calc(56px + env(safe-area-inset-top,0px));position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:16px;padding:env(safe-area-inset-top,0px) calc(22px + env(safe-area-inset-right,0px)) 0 calc(22px + env(safe-area-inset-left,0px));background:rgba(13,12,10,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{font:11px var(--mono);letter-spacing:.2em}.brand span{color:var(--dim)}.progress{height:2px;background:var(--line);flex:1;max-width:240px}.progress i{display:block;height:100%;background:var(--amber);transition:.3s}.count,.quiet{font:11px var(--mono);color:var(--dim)}.quiet{border:0;background:none;padding:8px 3px;cursor:pointer}.quiet:hover,.quiet.on{color:var(--ink)}main,.screen{max-width:720px;margin:auto;padding:calc(110px + env(safe-area-inset-top,0px)) 28px 100px}.eyebrow{font:11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:19px}h1{font:500 clamp(24px,3.5vw,32px)/1.34 var(--serif);margin:0 0 34px}.notes{margin:0 0 24px}.notes summary{cursor:pointer;color:var(--dim);font:11px var(--mono);list-style:none;padding:7px 0}.notes summary::-webkit-details-marker{display:none}.notes summary:before{content:"+ ";color:var(--amber)}.notes[open] summary:before{content:"− "}.note{border:0;border-left:1px solid var(--line);background:none;color:var(--dim);display:block;width:100%;text-align:left;padding:8px 14px;line-height:1.5;font-size:13px;cursor:pointer}.note:hover{color:var(--ink);border-color:var(--amber)}textarea{width:100%;min-height:260px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);caret-color:var(--amber);font:400 21px/1.65 var(--serif);padding:0}textarea::placeholder{color:var(--faint);font-style:italic}.meta{min-height:42px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}.meta .saved{font:10px var(--mono);color:var(--faint)}.meta .words{margin-left:auto;font:10px var(--mono);color:var(--faint)}.actions{display:flex;align-items:center;gap:10px;margin-top:16px}.pill{border:1px solid var(--line);background:none;border-radius:99px;padding:9px 17px;cursor:pointer;font:11px var(--mono)}.pill:hover{border-color:var(--dim)}.pill.primary{background:var(--amber);border-color:var(--amber);color:#17130d}.pill.done{color:var(--green);border-color:var(--green)}.nav{display:flex;justify-content:space-between;margin-top:58px}.nav button{border:0;background:none;color:var(--dim);font:11px var(--mono);cursor:pointer;padding:10px 0}.nav button:hover{color:var(--ink)}.nav b{color:var(--amber);font-weight:400}.screen{display:none}.screen.open{display:block}.screen h2{font:500 30px var(--serif);margin:0 0 8px}.sub{color:var(--dim);font-size:13px;margin-bottom:34px}.listrow{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:baseline;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:18px 2px;cursor:pointer}.listrow:hover{background:var(--panel)}.listrow .no,.listrow .stat{font:10px var(--mono);color:var(--faint)}.listrow .title{font:19px var(--serif)}.listrow .stat.done{color:var(--green)}.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.version{min-height:145px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column}.version.current{border-color:rgba(214,160,75,.5)}.vtop{display:flex;justify-content:space-between;gap:8px;font:10px var(--mono);color:var(--faint)}.vtext{font:15px/1.45 var(--serif);margin:15px 0;color:var(--dim);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.vfoot{margin-top:auto;display:flex;justify-content:flex-end}.restore{border:0;background:none;color:var(--amber);font:10px var(--mono);cursor:pointer;padding:4px}.empty{grid-column:1/-1;color:var(--dim);padding:60px 0;text-align:center;font:16px var(--serif)}.qselect{display:flex;gap:6px;overflow:auto;margin:22px 0 26px;padding-bottom:4px;-webkit-overflow-scrolling:touch}.qselect button{flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:none;color:var(--dim);font:10px var(--mono);cursor:pointer}.qselect button.on{border-color:var(--amber);color:var(--ink)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:99px;font:10px var(--mono);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.briefline{margin-top:45px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font:10px/1.8 var(--mono)}@media(max-width:640px){header{padding:env(safe-area-inset-top,0px) calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px));gap:10px}.brand span{display:none}.count{display:none}.quiet{padding:14px 8px;font-size:12px}main,.screen{padding:calc(88px + env(safe-area-inset-top,0px)) 20px calc(80px + env(safe-area-inset-bottom,0px))}h1{margin:0 0 26px}textarea{font-size:18px;min-height:220px}.notes summary{padding:13px 0;font-size:12px}.note{padding:13px 14px;font-size:14px}.actions{position:sticky;bottom:0;margin:14px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(13,12,10,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.pill{padding:14px 20px;font-size:12px;flex:1;text-align:center}.pill:active{transform:scale(.97)}.nav{margin-top:34px}.nav button{padding:16px 4px;font-size:12px}.listrow{padding:20px 2px}.bento{grid-template-columns:1fr}.version{min-height:0}.restore{padding:12px 8px;font-size:11px}.qselect button{width:40px;height:40px;font-size:11px}.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}.screen h2{font-size:26px}}
@media(hover:none){.quiet:hover,.nav button:hover,.note:hover,.listrow:hover,.pill:hover{background:none;border-color:var(--line);color:inherit}.pill.primary:hover{border-color:var(--amber)}.quiet.on{color:var(--ink)}}
</style></head><body>
<header><div class="brand">AGM <span>· Core Automation</span></div><div class="progress"><i id="fill"></i></div><div class="count" id="count"></div><button class="quiet" id="allbtn">all</button><button class="quiet" id="archivebtn">archive</button></header>
<main id="writer"><div id="stage"></div></main><section class="screen" id="all"></section><section class="screen" id="archive"></section><div class="toast" id="toast"></div>
<script>"use strict";
var QUESTIONS = [
  { n:1, short:"Name",
    form:"Name",
    hint:"As it should appear on the application.",
    notes:[] },
  { n:2, short:"Email",
    form:"Email",
    hint:"The one you actually read.",
    notes:[] },
  { n:3, short:"Link",
    form:"Anywhere we can best get an idea of your work, like a website, portfolio, or resume.",
    hint:"",
    notes:["kasra.world"] },
  { n:4, short:"Built or sold",
    form:"What have you built or sold online? Tell us about it. What did you learn? Include links and a rough sense of customers or revenue, if you can.",
    hint:"",
    notes:[
      "Built Percy (screenless voice recorder), poetry pills (poems on pharmacy labels on pill vials), and kasra.world.",
      "Pre-revenue so far.",
      "Possible plan: stand up a pill shop and get first real sales before applying."
    ]},
  { n:5, short:"Agent workflow",
    form:"What's an interesting agent-heavy workflow you use today? Show us a repo, screenshots, or a short recording. What do the agents handle, and where do you still step in?",
    hint:"",
    notes:[
      "Agent integrated across daily life for months.",
      "Overnight work shifts.",
      "Same-night site ships: loosen-up playlist page; trailer-742 PM simulator built from a 30-minute call recording.",
      "Contract reading.",
      "Agent-to-agent coordination with his brother's agent.",
      "GitHub org daedalusworkshop deploys.",
      "Where he still steps in: nothing irreversible without asking; emails shown before sending; coursework never auto-submits.",
      "He can describe the seams, which is what the question is really after."
    ]},
  { n:6, short:"$2k + tokens",
    form:"If we handed you $2,000 and unlimited tokens, what would you do in the first 72 hours? What would you try to learn, and what would make you change course?",
    hint:"",
    notes:[] },
  { n:7, short:"Availability",
    form:"When would you be available to spend three months in our San Francisco office? We're aiming for January through March 2027, with flexibility on exact start and end dates.",
    hint:"",
    notes:[
      "Conflict to weigh: January\u2013March is mid-spring-semester at Virginia Tech."
    ]}
];
var KEY="agm-app-v1",state=load(),cur=1,timer=null,lastArchived={};
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.drafts){s.history=s.history||{};return s}}catch(e){}return{drafts:{},history:{},activity:[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function draft(n){return state.drafts[n]||{text:"",done:false,updated:null}}
function words(t){t=(t||"").trim();return t?t.split(/\s+/).length:0}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(t){if(!t)return"";var d=new Date(t),same=d.toDateString()===new Date().toDateString();return same?d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):d.toLocaleDateString([],{month:"short",day:"numeric"})}
function history(n){return state.history[n]||[]}
function archiveCurrent(n){clearTimeout(timer);var d=draft(n),text=(d.text||"").trim();if(!text)return;var h=history(n);if((h[0]&&h[0].text===text)||lastArchived[n]===text)return;h.unshift({text:text,at:Date.now()});state.history[n]=h;lastArchived[n]=text;persist();updateHeader()}
function scheduleArchive(n){clearTimeout(timer);timer=setTimeout(function(){archiveCurrent(n)},12000)}
function status(n){var d=draft(n);return d.done?"done":d.text&&d.text.trim()?"drafting":"empty"}
function updateHeader(){var done=QUESTIONS.filter(function(q){return status(q.n)==="done"}).length;document.getElementById("fill").style.width=(done/7*100)+"%";document.getElementById("count").textContent=done+" of 7"}
function autosize(t){t.style.height="auto";t.style.height=Math.max(230,t.scrollHeight)+"px"}
function show(name){archiveCurrent(cur);["writer","all","archive"].forEach(function(id){var e=document.getElementById(id);if(id==="writer")e.style.display=name==="writer"?"block":"none";else e.classList.toggle("open",id===name)});document.getElementById("allbtn").classList.toggle("on",name==="all");document.getElementById("archivebtn").classList.toggle("on",name==="archive");window.scrollTo(0,0)}
function render(){show("writer");var q=QUESTIONS[cur-1],d=draft(cur),h='<div class="eyebrow">Question '+cur+' of 7</div><h1>'+esc(q.form)+'</h1>';if(q.notes.length){h+='<details class="notes"><summary>'+q.notes.length+' notes from your working doc</summary>';q.notes.forEach(function(x,i){h+='<button class="note" data-i="'+i+'">'+esc(x)+'</button>'});h+='</details>'}h+='<textarea id="draft" placeholder="'+esc(q.hint||"Start answering…")+'">'+esc(d.text)+'</textarea><div class="meta"><span class="saved">'+(d.updated?'saved '+fmt(d.updated):'saved on this device')+'</span><span class="words">'+words(d.text)+' words</span></div><div class="actions"><button class="pill primary" id="copy">copy answer</button><button class="pill '+(d.done?'done':'')+'" id="done">'+(d.done?'done ✓':'mark done')+'</button></div><div class="nav">'+(cur>1?'<button id="prev"><b>←</b> '+esc(QUESTIONS[cur-2].short)+'</button>':'<span></span>')+(cur<7?'<button id="next">'+esc(QUESTIONS[cur].short)+' <b>→</b></button>':'<button id="next">review all <b>→</b></button>')+'</div>';document.getElementById("stage").innerHTML=h;var ta=document.getElementById("draft");autosize(ta);ta.oninput=function(){var x=draft(cur);x.text=ta.value;x.updated=Date.now();if(!ta.value.trim())x.done=false;state.drafts[cur]=x;persist();ta.parentNode.querySelector('.saved').textContent='saved just now';ta.parentNode.querySelector('.words').textContent=words(ta.value)+' words';autosize(ta);scheduleArchive(cur);updateHeader()};ta.onblur=function(){archiveCurrent(cur)};document.querySelectorAll('.note').forEach(function(b){b.onclick=function(){var pos=ta.selectionStart||ta.value.length,x=q.notes[+b.dataset.i],pre=ta.value.slice(0,pos),post=ta.value.slice(pos);ta.value=pre+(pre?'\n':'')+x+(post?'\n':'')+post;ta.dispatchEvent(new Event('input'));ta.focus()}});document.getElementById('copy').onclick=function(){archiveCurrent(cur);navigator.clipboard.writeText(ta.value).then(function(){toast('copied')})};document.getElementById('done').onclick=function(){var x=draft(cur);x.done=!x.done;x.updated=Date.now();state.drafts[cur]=x;persist();archiveCurrent(cur);render()};var p=document.getElementById('prev');if(p)p.onclick=function(){archiveCurrent(cur);cur--;render()};document.getElementById('next').onclick=function(){archiveCurrent(cur);if(cur<7){cur++;render()}else renderAll()};updateHeader()}
function renderAll(){show('all');var done=QUESTIONS.filter(function(q){return status(q.n)==='done'}).length,h='<h2>All seven</h2><div class="sub">'+done+' marked done. Pick up anywhere.</div>';QUESTIONS.forEach(function(q){var d=draft(q.n),st=status(q.n);h+='<button class="listrow" data-n="'+q.n+'"><span class="no">'+q.n+'</span><span class="title">'+esc(q.short)+'</span><span class="stat '+st+'">'+(st==='done'?'done':d.text?words(d.text)+' words':'—')+'</span></button>'});h+='<div class="briefline">Associate GM · cohort of 4 · San Francisco · Jan–Mar 2027 · $10k/month + profit share · questions: riley@coreauto.com</div>';document.getElementById('all').innerHTML=h;document.querySelectorAll('.listrow').forEach(function(b){b.onclick=function(){cur=+b.dataset.n;render()}})}
function renderArchive(n){n=n||cur;show('archive');var q=QUESTIONS[n-1],items=history(n),d=draft(n),h='<h2>Answer archive</h2><div class="sub">Saved automatically as your answer changes.</div><div class="qselect">';QUESTIONS.forEach(function(x){h+='<button data-q="'+x.n+'" class="'+(x.n===n?'on':'')+'">'+x.n+'</button>'});h+='</div><div class="bento">';if(d.text&&d.text.trim())h+=card({text:d.text,at:d.updated},true,-1);items.forEach(function(x,i){if(x.text!==(d.text||'').trim())h+=card(x,false,i)});if(!d.text&&!items.length)h+='<div class="empty">Old answers for “'+esc(q.short)+'” will collect here.</div>';h+='</div>';document.getElementById('archive').innerHTML=h;document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){renderArchive(+b.dataset.q)}});document.querySelectorAll('[data-restore]').forEach(function(b){b.onclick=function(){var i=+b.dataset.restore,item=history(n)[i];archiveCurrent(n);state.drafts[n]={text:item.text,done:false,updated:Date.now()};persist();cur=n;toast('restored');render()}})}
function card(x,current,i){return '<article class="version '+(current?'current':'')+'"><div class="vtop"><span>'+(current?'current':'saved '+fmt(x.at))+'</span><span>'+words(x.text)+' words</span></div><div class="vtext">'+esc(x.text)+'</div><div class="vfoot">'+(current?'':'<button class="restore" data-restore="'+i+'">restore</button>')+'</div></article>'}
function toast(s){var e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1300)}
document.getElementById('allbtn').onclick=renderAll;document.getElementById('archivebtn').onclick=function(){renderArchive(cur)};document.addEventListener('keydown',function(e){if(e.key==='Escape')render();if((e.metaKey||e.ctrlKey)&&e.key==='ArrowLeft'&&cur>1){cur--;render()}if((e.metaKey||e.ctrlKey)&&e.key==='ArrowRight'&&cur<7){cur++;render()}});window.addEventListener('beforeunload',function(){archiveCurrent(cur)});render();
</script></body></html>
